<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Glow & Melt</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body class="site-shell"><div class="stars"></div><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">☾</span><span>GLOW <i>&</i> MELT</span></a><a class="back-home" href="index.html">← Continue shopping</a></header><main class="checkout section"><div class="section-head"><div><div class="eyebrow">ONE LAST LITTLE STEP</div><h2>Checkout.</h2></div><p>Pay by UPI and send the UTR for manual confirmation.</p></div><div class="checkout-grid"><section class="panel"><h3>Delivery details</h3><form id="profileForm" class="form-grid"><label>Full name<input id="name" required></label><label>Phone<input id="phone" required></label><label>City<input id="city" required></label><label>State<input id="state"></label><label>PIN / ZIP<input id="pin" required></label><label class="wide">Address<textarea id="address" required></textarea></label></form></section><section class="panel payment-panel"><h3>Your order</h3><div id="orderLines"></div><div class="cart-total"><span>Total</span><b>₹<span id="total">0</span></b></div><div class="upi-box"><div class="eyebrow">UPI PAYMENT</div><strong id="upiId"></strong><p>Open your UPI app, pay the exact amount, then paste the transaction reference below.</p><a id="upiLink" class="btn outline full" href="#">Open UPI app</a></div><label>UTR / transaction reference<input id="utr" minlength="6" required placeholder="e.g. 412398765432"></label><button class="btn gold full" id="placeOrder">Place order</button><p id="checkoutMsg" class="error"></p></section></div></main><script src="js/checkout.js"></script></body></html>
